[package]
name = "veloc-codegen"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
veloc-analyzer.workspace = true
veloc-encoder.workspace = true
veloc-types = { workspace = true }
veloc-mir = { path = "../mir", features = ["std"] }
veloc-lir = { workspace = true, features = ["std"] }
cranelift-entity = { workspace = true }
object = { version = "0.36", features = ["write"] }
hashbrown = { workspace = true }
smallvec.workspace = true

[build-dependencies]
# 构建时依赖
veloc-spec = { workspace = true }
