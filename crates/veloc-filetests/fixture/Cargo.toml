[package]
name = "veloc-test-mir"
version = "0.1.0"
edition = { workspace = true }
publish = false

# Compile the real MIR implementation against extra test-only definitions.
# No copied runtime, mocked type rules, or knowledge of generated handler IDs.
[lib]
path = "lib.rs"
test = false
doctest = false

[dependencies]
bitflags = { version = "2.11.0", default-features = false }
cranelift-entity = { workspace = true }
hashbrown = { workspace = true, features = ["ahash", "inline-more"] }
thiserror = { version = "2.0", default-features = false }
smallvec = { workspace = true }

[build-dependencies]
veloc-opgen = { workspace = true }
veloc-semantics = { workspace = true }

[dev-dependencies]
veloc-semantics = { workspace = true }
veloc-lir = { workspace = true }

[features]
default = ["std"]
std = []
