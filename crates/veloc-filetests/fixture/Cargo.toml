[package]
name = "veloc-test-mir"
version = "0.1.0"
edition = { workspace = true }
publish = false

# Compile the real MIR implementation against extra test-only definitions.
# No copied runtime, mocked type rules, or knowledge of generated handler IDs.
[lib]
path = "lib.rs"
test = false
doctest = false

[dependencies]
veloc-collections = { workspace = true }
veloc-types = { workspace = true }
cranelift-entity = { workspace = true }
hashbrown = { workspace = true, features = ["ahash", "inline-more"] }
smallvec = { workspace = true }

[build-dependencies]
veloc-spec = { workspace = true }

[dev-dependencies]
veloc-semantics = { workspace = true }

[features]
default = ["std"]
std = []
