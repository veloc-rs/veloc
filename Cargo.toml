[package]
name = "veloc"
version = "0.1.0"
edition = { workspace = true }


[workspace]
members = [
	"crates/*",
	"crates/veloc-wasm/tests/spec_test",
	"veloc/mir",
	"veloc/types",
	"veloc/collections",
	"veloc/bytecode",
	"veloc/lir",
	"veloc/interpreter",
	"veloc/codegen",
	"veloc/encoder",
	"veloc/analyzer",
	"veloc/optimizer",
	"veloc/spec",
	"veloc/semantics",
]

[workspace.package]
edition = "2024"
rust-version = "1.93.0"

[workspace.dependencies]
# --- Internal Crates ---
veloc = { path = "." }
veloc-types = { path = "veloc/types" }
veloc-collections = { path = "veloc/collections" }
veloc-bytecode = { path = "veloc/bytecode" }
veloc-mir = { path = "veloc/mir" }
veloc-lir = { path = "veloc/lir" }
veloc-optimizer = { path = "veloc/optimizer" }
veloc-interpreter = { path = "veloc/interpreter" }
veloc-codegen = { path = "veloc/codegen" }
veloc-encoder = { path = "veloc/encoder" }
veloc-analyzer = { path = "veloc/analyzer" }
veloc-wasm = { path = "crates/veloc-wasm" }

# --- Definition compiler ---
veloc-spec = { path = "veloc/spec" }
veloc-semantics = { path = "veloc/semantics" }

# --- WebAssembly ---
wasmparser = { version = "0.244.0", default-features = false, features = ["std", "validate", "simd"] }
wat = "1.244.0"
wast = "229.0.0"

# --- System / Low-level ---
libc = "0.2.180"
mmap-rs = "0.7.0"

# --- Data Structures ---
hashbrown = { version = "0.14" }
bitvec = "1.0"
bitflags = { version = "2.11", default-features = false }
smallvec = { version = "1.13", default-features = false }
cranelift-entity = { version = "0.128.3", default-features = false }

# --- Logging ---
log = "0.4"
env_logger = "0.11"

# --- CLI ---
clap = { version = "4.5", features = ["derive"] }

# --- Error Handling ---
anyhow = "1.0"

# --- External Local Dependencies ---
elf_loader = { version = "0.14.1" }

[dependencies]
veloc-mir = { workspace = true }
veloc-lir = { workspace = true }
veloc-interpreter = { workspace = true }
veloc-codegen = { workspace = true }

[features]
default = ["std"]
std = []

[profile.release]
debug = "line-tables-only"
